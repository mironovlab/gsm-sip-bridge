<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 55 880 270" width="880" height="270" role="img" aria-label="A carrier delivers calls over GSM, VoWiFi or VoLTE to gsm-sip-bridge, which hands them to your PBX or SIP phones over SIP">
  <style>
    :root { --ink:#1f2328; --muted:#59636e; --box:#f6f8fa; --edge:#d1d9e0; --accent:#0f766e; --accent-soft:#e6f4f1; --cs:#9a6700; --wifi:#0969da; --lte:#8250df; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e6edf3; --muted:#9198a1; --box:#151b23; --edge:#3d444d; --accent:#2dd4bf; --accent-soft:#0d2b28; --cs:#d29922; --wifi:#4493f8; --lte:#ab7df8; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .t { font-size: 17px; font-weight: 600; }
    .s { font-size: 13px; fill: var(--muted); }
    .l { font-size: 13px; font-weight: 600; }
    .box { fill: var(--box); stroke: var(--edge); stroke-width: 1.5; }
    .hero { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .path { fill: none; stroke-width: 3; stroke-linecap: round; }
    .chip { fill: var(--box); stroke: var(--edge); stroke-width: 1; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <!-- carrier -->
  <rect class="box" x="20" y="70" width="150" height="190" rx="14"/>
  <text class="t" x="95" y="158" text-anchor="middle">Mobile</text>
  <text class="t" x="95" y="180" text-anchor="middle">carrier</text>

  <!-- three paths -->
  <path class="path" style="stroke:var(--cs)" d="M170 105 C 250 105, 290 95, 400 120"/>
  <path class="path" style="stroke:var(--wifi)" d="M170 165 L 400 165"/>
  <path class="path" style="stroke:var(--lte)" d="M170 225 C 250 225, 290 235, 400 210"/>

  <rect class="chip" x="208" y="91" width="132" height="24" rx="12"/>
  <text class="l" x="274" y="108" text-anchor="middle" style="fill:var(--cs)">GSM voice</text>
  <rect class="chip" x="208" y="153" width="132" height="24" rx="12"/>
  <text class="l" x="274" y="170" text-anchor="middle" style="fill:var(--wifi)">VoWiFi</text>
  <rect class="chip" x="208" y="215" width="132" height="24" rx="12"/>
  <text class="l" x="274" y="232" text-anchor="middle" style="fill:var(--lte)">VoLTE</text>

  <!-- bridge -->
  <rect class="hero" x="400" y="80" width="200" height="170" rx="14"/>
  <text class="t" x="500" y="150" text-anchor="middle">gsm-sip-bridge</text>
  <text class="s" x="500" y="174" text-anchor="middle">on a Linux box or Pi</text>
  <text class="s" x="500" y="194" text-anchor="middle">SIM in a modem or</text>
  <text class="s" x="500" y="212" text-anchor="middle">a USB card reader</text>

  <!-- SIP side -->
  <line x1="606" y1="165" x2="690" y2="165" stroke="var(--muted)" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="s" x="648" y="153" text-anchor="middle">SIP</text>

  <rect class="box" x="696" y="70" width="164" height="190" rx="14"/>
  <text class="t" x="778" y="135" text-anchor="middle">Your PBX</text>
  <text class="s" x="778" y="158" text-anchor="middle">Asterisk, FreePBX…</text>
  <text class="s" x="778" y="190" text-anchor="middle">or SIP phones</text>
  <text class="s" x="778" y="208" text-anchor="middle">registered directly</text>

  <!-- footer -->
  <text class="s" x="440" y="304" text-anchor="middle">Calls both ways · SMS to the web UI and Discord · several SIMs at once</text>
</svg>
